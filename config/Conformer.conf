{
    "database_path": "./LA/",
    "model_path": "./models/weights/Conformer.pth",
    "batch_size": 24,
    "num_epochs": 20,
    "loss": "CCE",
    "track": "LA",
    "eval_all_best": "True",
    "eval_output": "eval_scores_using_best_dev_model.txt",
    "freq_aug": "False",
    "cudnn_deterministic_toggle": "False",
