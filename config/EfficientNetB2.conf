{
    "database_path": "./LA/", 
    "model_path": "./models/weights/EfficientNetB2.pth",
    "batch_size": 32,
    "num_epochs": 20,
    "loss": "CCE",
    
    "eval_all_best": "True",
    "freq_aug": "False",
    "cudnn_deterministic_toggle": "False",
    "cudnn_benchmark_toggle": "True",
    "use_amp": true,
    "use_compile": false,
    "model_config": {
        "architecture": "EfficientNetB2",
        "dropout": 0.3,
        "pretrained": true,
        "freeze_backbone": false
    },
    "optim_config": {
        "optimizer": "adam",
        "amsgrad": "False",
        "base_lr": 0.0001,
        "lr_min": 0.000001,
        "betas": [0.9, 0.999],
        "weight_decay": 0.0001,
        "scheduler": "cosine"
    }
}
