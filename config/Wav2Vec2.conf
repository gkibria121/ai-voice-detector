{
    "model_config": {
        "architecture": "Wav2Vec2",
        "pretrained_model": "facebook/wav2vec2-base",
        "num_classes": 2,
        "freeze_encoder": false,
        "freeze_feature_extractor": true,
        "dropout": 0.1,
        "pooling": "mean"
    },
    "optim_config": {
        "optimizer": "AdamW",
        "base_lr": 1e-5,
        "weight_decay": 0.01,
        "scheduler": "cosine"
    },
    "training": {
        "feature_type": 0,
        "batch_size": 8,
        "num_epochs": 20,
        "early_stopping_patience": 5
    }
}
